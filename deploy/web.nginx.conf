# In-container nginx for the web image. Serves the Vite-built SPA from
# /usr/share/nginx/html with SPA fallback. The outer nginx (running in the
# `nginx` service) terminates TLS and reverse-proxies / to this container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aggressive caching for hashed Vite assets (their filenames embed the
    # content hash). The HTML entry must NOT be cached so deploys are visible
    # immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else falls back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Outer nginx — terminates TLS, proxies to the api and web containers.
#
# SSE NOTE: /api/screener/stream is a long-lived Server-Sent Events stream.
# Without `proxy_buffering off` nginx accumulates the response in 4 KB chunks
# and the browser receives updates in bursts every few seconds (or after the
# stream closes), which kills live updates. Same applies to the per-cycle
# delta payload.
#
# TLS bootstrap: deploy/init-letsencrypt.sh creates a dummy self-signed cert
# so nginx can start, then runs certbot via the certbot service to replace
# it with a real Let's Encrypt cert. After the first run, the certbot
# service auto-renews every 12h.

events {
    worker_connections 1024;
}

http {
    # Real client IPs end up in API logs even though they came through the
    # docker bridge → outer nginx → api proxy chain.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # Larger header buffers for JWTs in headers + filter snapshots in JSON.
    large_client_header_buffers 4 16k;

    # Gzip text-y content. The static SPA assets benefit most.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ─── port 80 ────────────────────────────────────────────────────────
    # ACME HTTP-01 challenge passthrough. Everything else 301s to HTTPS.
    server {
        listen 80;
        server_name pnldash.uz www.pnldash.uz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── port 443 ──────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name pnldash.uz www.pnldash.uz;

        ssl_certificate /etc/letsencrypt/live/pnldash.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pnldash.uz/privkey.pem;

        # Modern intermediate config — drops TLS 1.0/1.1.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # SPA assets: long lived for hashed files.
        # The web container's nginx already handles SPA fallback internally.
        location / {
            proxy_pass http://web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE — disable buffering so events flush immediately.
        location = /api/screener/stream {
            proxy_pass http://api:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            chunked_transfer_encoding off;
        }

        # Everything else under /api proxies to the API service normally.
        location /api/ {
            proxy_pass http://api:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

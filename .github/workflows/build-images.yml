name: Build & deploy

# Builds the api and web Docker images, pushes them to GHCR, then SSHes to
# the droplet and rolls out the new versions. Triggers:
#   - push to main: tags `latest` and `sha-<short>`, then deploys
#   - manual run via workflow_dispatch
#
# Path filter: any change that affects what runs in production (app source,
# compose, nginx config, migrations, the workflow itself) triggers a deploy.
# Everything else (README, docs/, the bash poller scripts) skips the workflow.

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'db/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # ─── 1. Build & push images to GHCR ─────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: deploy/api.Dockerfile
          - name: web
            dockerfile: deploy/web.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/pnldash-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/pnldash-${{ matrix.name }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # ─── 2. Deploy to droplet ───────────────────────────────────────────
  # Runs only after both api and web images are pushed successfully.
  # Pulls the repo, pulls the new images, and rolls out via docker compose.
  # Idempotent: safe to re-run on the same commit.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key so the connection isn't vulnerable to MITM on
          # first contact. ssh-keyscan against the known IP is fine — we
          # accept whatever key is currently presented because there's no
          # baseline we trust more, but at least subsequent runs will
          # detect a host-key change.
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Roll out
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" 'bash -se' <<'REMOTE'
            set -euo pipefail
            cd /root/projects/pnldash

            echo "::group::git pull"
            git pull --ff-only
            echo "::endgroup::"

            echo "::group::docker compose pull"
            docker compose -f docker-compose.prod.yml pull
            echo "::endgroup::"

            echo "::group::docker compose up -d"
            docker compose -f docker-compose.prod.yml up -d
            echo "::endgroup::"

            # nginx.conf is a bind mount, and nginx caches upstream IPs — after
            # api/web are recreated it can hold stale IPs and serve 502s. Validate
            # the (live bind-mounted) config, then restart the container so it
            # reloads config AND re-resolves api/web DNS. A ~1s blip, but it kills
            # the stale-upstream 502 for good.
            echo "::group::nginx restart"
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -t
            docker compose -f docker-compose.prod.yml restart nginx
            echo "::endgroup::"

            # Apply any new migrations, then assert none remain pending — dbmate
            # has been seen to silently no-op, so fail the deploy loudly if the
            # schema is still behind. DATABASE_URL uses localhost because dbmate
            # runs on the host, not in the docker network.
            echo "::group::dbmate up"
            PG_PASS=$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2-)
            export DATABASE_URL="postgres://pnldash:${PG_PASS}@localhost:5432/pnldash?sslmode=disable"
            dbmate up
            PENDING=$(dbmate status 2>/dev/null | grep -cE '^\[ \]' || true)
            if [ "$PENDING" -ne 0 ]; then
              echo "::error::dbmate left ${PENDING} migration(s) pending after 'dbmate up' — schema is behind"
              exit 1
            fi
            echo "schema up to date — no migrations pending"
            echo "::endgroup::"

            echo "::group::final status"
            docker compose -f docker-compose.prod.yml ps
            echo "::endgroup::"
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
